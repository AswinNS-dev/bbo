<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2V2 Skirmish Showdown – Bracket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#161a24;
    --muted:#6b7385;
    --faint:#a3aabb;
    --accent:#2d4a9a;
    --accent-tint:#dfe6f7;
    --line:#b9c3dc;
    --card:rgba(255,255,255,.72);
    --row:#eef1f8;
    --row-hover:#e3e9f7;
    --red:#ee4b4b;
    --card-w:290px;
    --col-gap:64px;
    --slot:150px;
    --card-h:132px;
    --font-display:'Rajdhani', sans-serif;
    --font-body:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    font-family:var(--font-body);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    background:
      repeating-linear-gradient(0deg, rgba(120,140,190,.05) 0 1px, transparent 1px 4px),
      linear-gradient(180deg,#f6f8fd 0%,#e9eef9 100%);
  }
  .wrap{max-width:1720px;margin:0 auto;padding:0 40px 60px;}

  /* ---------- LOGO ---------- */
  .logo-bar{display:flex;justify-content:center;padding:26px 0 18px;border-bottom:1px solid var(--line);margin-bottom:22px;}
  .logo-bar img{height:84px;width:auto;display:block;}

  /* ---------- HEADER ---------- */
  .back{font-size:14px;color:var(--muted);text-decoration:none;}
  .title-row{display:flex;align-items:center;gap:16px;margin:10px 0 26px;flex-wrap:wrap;}
  h1{font-family:var(--font-display);font-weight:700;font-size:38px;letter-spacing:.03em;margin:0;text-transform:uppercase;line-height:1;}
  .badge{font-family:var(--font-display);font-weight:700;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--accent);background:var(--accent-tint);border-radius:999px;padding:6px 14px;}
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);overflow-x:auto;}
  .tab{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);padding:14px 18px;border-bottom:2px solid transparent;white-space:nowrap;}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}

  .section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:34px 0 12px;flex-wrap:wrap;}
  h2{font-family:var(--font-display);font-weight:700;font-size:28px;letter-spacing:.03em;margin:0;text-transform:uppercase;}
  .reset-btn{
    font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;
    color:#fff;background:var(--red);border:0;padding:13px 26px;cursor:pointer;
    clip-path:polygon(0 0,100% 0,100% 72%,94% 100%,0 100%);
    transition:filter .15s, transform .1s;
  }
  .reset-btn:hover{filter:brightness(1.08);}
  .reset-btn:active{transform:scale(.97);}
  .hint{color:var(--muted);font-size:14px;margin:0 0 22px;}

  /* ---------- BRACKET ---------- */
  .bracket-scroll{overflow:auto;padding-bottom:16px;}
  .bracket{position:relative;}
  .round-head{
    position:absolute;top:0;width:var(--card-w);text-align:center;
    font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);
  }
  svg.lines{position:absolute;top:0;left:0;pointer-events:none;}
  .match{
    position:absolute;width:var(--card-w);height:var(--card-h);
    background:var(--card);border:1px solid rgba(185,195,220,.6);
    padding:10px 12px 12px;
    box-shadow:0 1px 8px rgba(45,74,154,.06);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%);
  }
  .match-num{font-size:12px;color:var(--muted);letter-spacing:.02em;margin:0 0 7px 2px;text-transform:uppercase;}
  .slot{
    display:flex;align-items:center;gap:8px;height:38px;margin-bottom:6px;padding:0 12px;
    background:var(--row);border-radius:5px;cursor:pointer;
    transition:background .12s;
  }
  .slot:last-child{margin-bottom:0;}
  .slot:hover:not(.tbd){background:var(--row-hover);}
  .slot .tag{font-size:13px;color:var(--muted);flex-shrink:0;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .slot .name{font-size:16px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .slot .score{font-size:16px;font-weight:700;color:#3b4254;}
  .slot.tbd{cursor:default;}
  .slot.tbd .name{color:var(--faint);font-size:17px;}
  .slot.tbd .score{color:#5a6175;}
  .slot.winner{background:var(--accent);}
  .slot.winner .tag{color:rgba(255,255,255,.75);}
  .slot.winner .name,.slot.winner .score{color:#fff;}
  .slot.loser .name,.slot.loser .tag{color:var(--faint);}

  .champion{
    position:absolute;width:var(--card-w);text-align:center;padding:18px 14px;
    background:var(--card);border:1.5px dashed var(--line);
  }
  .champion.done{background:#fff;border:2px solid var(--accent);box-shadow:0 0 24px rgba(45,74,154,.25);}
  .champion svg{width:30px;height:30px;color:var(--faint);}
  .champion.done svg{color:var(--accent);}
  .champion .lbl{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.2em;color:var(--muted);margin-top:4px;}
  .champion.done .lbl{color:var(--accent);}
  .champion .cname{font-family:var(--font-display);font-weight:700;font-size:22px;text-transform:uppercase;margin-top:4px;color:var(--faint);}
  .champion.done .cname{color:var(--ink);}

  @media (max-width:720px){
    .wrap{padding:0 16px 40px;}
    .logo-bar img{height:60px;}
    h1{font-size:28px;}
  }
</style>
</head>

  const ROUND_LABELS = ["Round of 32","Round of 16","Quarterfinal","Semifinal","Grand Final"];
  const MATCH_COUNTS = [16,8,4,2,1];

  // Match numbers: R32 = #1-16, R16 = #17-24, QF = #25-28, SF = #29-30, Final = #31
  const MATCH_OFFSET = [0,16,24,28,30];

  /* Layout constants (must match CSS) */
  const CARD_W = 290, CARD_H = 132, COL_GAP = 64, SLOT = 150, HEAD_H = 56;

  /* STATE */
  let winnerIds = {};

  /* DERIVED BRACKET LOGIC */
  function getMatchTeams(round, match){
    if(round === 0) return [ORIGINAL_TEAMS[match*2], ORIGINAL_TEAMS[match*2+1]];
    return [getWinner(round-1, match*2), getWinner(round-1, match*2+1)];
  }
  function getWinner(round, match){
    const teams = getMatchTeams(round, match);
    const picked = winnerIds[round+"-"+match];
    if(picked == null) return null;
    return teams.find(t => t && t.id === picked) || null; // self-heals if upstream changes
  }
  function selectWinner(round, match, id){
    const key = round+"-"+match;
    winnerIds[key] = (winnerIds[key] === id) ? null : id; // click again to undo
    render();
  }
  function resetBracket(){ winnerIds = {}; render(); }

  /* POSITIONS: each match is centred between its two feeders */
  function centerY(round, match){
    if(round === 0) return HEAD_H + match*SLOT + SLOT/2;
    return (centerY(round-1, match*2) + centerY(round-1, match*2+1)) / 2;
  }
  const colX = r => r * (CARD_W + COL_GAP);

  const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  function render(){
    const host = document.getElementById("bracket");
    const totalW = colX(4) + CARD_W;
    const totalH = HEAD_H + MATCH_COUNTS[0]*SLOT + 20;
    host.style.width = totalW + "px";
    host.style.height = totalH + "px";

    let html = "";

    // connector lines
    let paths = "";
    for(let r=0; r<4; r++){
      for(let m=0; m<MATCH_COUNTS[r]; m++){
        const x1 = colX(r) + CARD_W, y1 = centerY(r,m);
        const x2 = colX(r+1),        y2 = centerY(r+1, Math.floor(m/2));
        const mid = x1 + COL_GAP/2;
        paths += `<path d="M ${x1} ${y1} L ${mid} ${y1} L ${mid} ${y2} L ${x2} ${y2}" fill="none" stroke="#b9c3dc" stroke-width="1.5"/>`;
      }
    }
    html += `<svg class="lines" width="${totalW}" height="${totalH}">${paths}</svg>`;

    // round headings
    ROUND_LABELS.forEach((label, r)=>{
      html += `<div class="round-head" style="left:${colX(r)}px;">${label}</div>`;
    });

    // matches
    for(let r=0; r<5; r++){
      for(let m=0; m<MATCH_COUNTS[r]; m++){
        const teams = getMatchTeams(r,m);
        const winner = getWinner(r,m);
        const top = centerY(r,m) - CARD_H/2;
        html += `<div class="match" style="left:${colX(r)}px;top:${top}px;">`;
        html += `<div class="match-num">Match #${MATCH_OFFSET[r]+m+1}</div>`;
        teams.forEach(t=>{
          if(!t){
            html += `<div class="slot tbd"><span class="name">TBD</span><span class="score">0</span></div>`;
          } else {
            const isW = winner && winner.id === t.id;
            const isL = winner && !isW;
            html += `<div class="slot${isW?" winner":""}${isL?" loser":""}" data-r="${r}" data-m="${m}" data-id="${t.id}">`+
                    `<span class="tag">${esc(t.tag)}</span><span class="name">${esc(t.name)}</span>`+
                    `<span class="score">${isW?1:0}</span></div>`;
          }
        });
        html += `</div>`;
      }
    }

    // champion box under the grand final
    const champ = getWinner(4,0);
    const cTop = centerY(4,0) + CARD_H/2 + 28;
    html += `<div class="champion${champ?" done":""}" style="left:${colX(4)}px;top:${cTop}px;">`+
      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">`+
      `<path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4Z"/><path d="M7 5H4a1 1 0 0 0-1 1v1a4 4 0 0 0 4 4M17 5h3a1 1 0 0 1 1 1v1a4 4 0 0 1-4 4"/></svg>`+
      `<div class="lbl">CHAMPION</div>`+
      `<div class="cname">${champ ? esc(champ.name) : "Awaiting finalists"}</div></div>`;

    host.innerHTML = html;

    host.querySelectorAll(".slot[data-id]").forEach(s=>{
      s.addEventListener("click", ()=> selectWinner(+s.dataset.r, +s.dataset.m, +s.dataset.id));
    });
  }

  document.getElementById("resetBtn").addEventListener("click", resetBracket);
  render();
})();
</script>
</body>
</html>
